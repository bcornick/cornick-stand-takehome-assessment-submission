# ABOUTME: Default-profile services: Stand's leadgen and mailbox, and the app; eval-profile services: their own leadgen and mailbox, and the eval runner. Requires Docker Compose 2.20 or later.
# ABOUTME: Host ports default to Stand's 8081 and 8025 and the app's 8000; LEADGEN_PORT, MAILBOX_PORT and APP_PORT move them. Each service has its own named volume; the app and the eval runner read .env and interpolate the run settings.
services:
  leadgen:
    build:
      context: ./sim-harness
      dockerfile: leadgen/Dockerfile
    ports: ["${LEADGEN_PORT:-8081}:8080"]
    environment:
      DEBUG: "${DEBUG:-false}"
      LEADGEN_DB: "/data/leadgen.db"
    volumes: ["leadgen-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  mailbox:
    build:
      context: ./sim-harness
      dockerfile: mailbox/Dockerfile
    ports: ["${MAILBOX_PORT:-8025}:8080"]
    environment:
      MAILBOX_DB: "/data/mailbox.db"
    volumes: ["mailbox-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        GIT_COMMIT: "${GIT_COMMIT:-unknown}"
    ports: ["${APP_PORT:-8000}:8000"]
    env_file: .env
    environment:
      RUN_MODE: "${RUN_MODE:-replay}"
      SEED: "${SEED:-42}"
      MODEL_ID: "${MODEL_ID:-deepseek-flash}"
      MODEL_BASE_URL: "${MODEL_BASE_URL:-https://api.deepseek.com/anthropic}"
      LEADGEN_URL: "http://leadgen:8080"
      MAILBOX_URL: "http://mailbox:8080"
      UWH_DB: "/data/app-${RUN_MODE:-replay}.db"
    volumes:
      - "app-data:/data"
      - "./recordings:/app/recordings:${RECORDINGS_ACCESS:-ro}"
    depends_on:
      leadgen:
        condition: service_healthy
      mailbox:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/run', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  leadgen-eval:
    profiles: [eval]
    build:
      context: ./sim-harness
      dockerfile: leadgen/Dockerfile
    environment:
      DEBUG: "${DEBUG:-false}"
      LEADGEN_DB: "/data/leadgen.db"
    volumes: ["leadgen-eval-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  mailbox-eval:
    profiles: [eval]
    build:
      context: ./sim-harness
      dockerfile: mailbox/Dockerfile
    environment:
      MAILBOX_DB: "/data/mailbox.db"
    volumes: ["mailbox-eval-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  eval:
    profiles: [eval]
    build:
      context: .
      dockerfile: Dockerfile
      target: eval
      args:
        GIT_COMMIT: "${GIT_COMMIT:-unknown}"
    env_file: .env
    environment:
      RUN_MODE: replay
      SEED: "42"
      MODEL_ID: "${MODEL_ID:-deepseek-flash}"
      LEADGEN_URL: "http://leadgen-eval:8080"
      MAILBOX_URL: "http://mailbox-eval:8080"
    volumes:
      - "./recordings:/app/recordings:${RECORDINGS_ACCESS:-ro}"
      - "./evals/results.jsonl:/app/evals/results.jsonl"
    depends_on:
      leadgen-eval:
        condition: service_healthy
      mailbox-eval:
        condition: service_healthy

volumes:
  leadgen-data:
  mailbox-data:
  app-data:
  leadgen-eval-data:
  mailbox-eval-data:
