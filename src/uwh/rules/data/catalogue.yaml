# ABOUTME: The producer catalogue: the questions and the one document request that no registry field covers.
# ABOUTME: `row` is the interpretation row each question comes from.

# Answer types are the registry's (a yes or no is `toggle`), or `document` for a document request, which is not a question.
questions:
  willing_to_mitigate:
    wording: "Would the applicant be willing to mitigate greater distance?"
    answer_type: toggle
    row: I17
  rce_documentation:
    wording: "Please send documentation supporting the Coverage A amount requested, for example the current declarations page."
    answer_type: document
    row: I37
