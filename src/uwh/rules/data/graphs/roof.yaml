# ABOUTME: The Roof page as a decision graph: a Class A roof is okay to quote, a roof of another class takes a requirement by the fire probability band, and an old composition roof takes an advisory (I52).
# ABOUTME: The Unknown Class branch is not encoded (I20): the class comes from the derivation map, and a missing class leaves the page undecided.
id: roof
page: docs/playbook/05-roof-class/flowchart.md
applies_when: {always: true}
root: roof
nodes:
  roof: {kind: all_of, board_path: [], children: [roof_class, composition_roof]}
  roof_class:
    kind: test
    field: roof_classification
    board_path: ["05:ROOT"]
    cases:
      - {when: {equals: Class A}, then: okay_class_a}
      - {when: {in: [Class B, Class C]}, then: non_class_a_band}
  non_class_a_band:
    kind: test
    field: p_f
    interpretation: I18
    board_path: ["05:NCA"]
    cases:
      - {when: {lte: 0.15}, then: okay_low}
      - {when: {gt: 0.15, lt: 0.50}, then: confirm_first_term}
      # 0.50 takes this band: the board states both sides and leaves it in neither (I18).
      - {when: {gte: 0.50}, then: confirm_60_days}
  okay_class_a: {kind: outcome, board_path: ["05:CA", "05:OK_A"], effects: [{type: no_action, rule: RF-1}]}
  okay_low: {kind: outcome, board_path: ["05:N_LO", "05:OK_B"], effects: [{type: no_action, rule: RF-2}]}
  confirm_first_term:
    kind: outcome
    board_path: ["05:N_MID", "05:N_MID_R"]
    effects:
      - {type: requirement, rule: RF-3, text: "Confirmation of a Class A roof or its replacement", deadline: first_term}
  confirm_60_days:
    kind: outcome
    board_path: ["05:N_HI", "05:N_HI_R"]
    effects:
      - {type: requirement, rule: RF-4, text: "Confirmation of a Class A roof or its replacement", deadline: within_60_days}

  # Composition shingles older than 20 years on a home above a fire probability of 0.15 (I52).
  composition_roof:
    kind: test
    field: roof_material
    interpretation: I52
    board_path: ["05:ROOT"]
    cases:
      - {when: {in: [Asphalt Fiberglass Composite, Architecture Shingles]}, then: roof_age}
      - when: {in: [Clay Tile, Concrete Tile, Metal Shingles / Sheets, Slate, Standing Seam Metal, Wood Shake, Wood Shingle, Other]}
        then: no_roof_advisory
  roof_age:
    kind: test
    field: roof_age_years
    interpretation: I52
    board_path: []
    cases:
      - {when: {lte: 20}, then: no_roof_advisory}
      - {when: {gt: 20}, then: old_roof_fire_probability}
  old_roof_fire_probability:
    kind: test
    field: p_f
    interpretation: I52
    board_path: []
    cases:
      - {when: {lte: 0.15}, then: no_roof_advisory}
      - {when: {gt: 0.15}, then: old_composition_roof}
  old_composition_roof:
    kind: outcome
    interpretation: I52
    board_path: ["I52"]  # the row: these roofs sit in neither of the board's Unknown Class lists
    effects:
      - {type: advisory, rule: RF-5, text: "A review of the roof's condition before binding, because a composition shingle roof more than 20 years old is a higher risk."}
  no_roof_advisory: {kind: outcome, board_path: [], effects: []}
