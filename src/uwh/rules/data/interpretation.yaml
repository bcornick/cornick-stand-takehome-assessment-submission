    ruling: "Fail when `p_f` is above 0.50; \"Do Not Write\" is never produced; at or below 0.50 the page does not apply. The threshold is this submission's invention and the first question for Stand. Generated values fall at or below 0.20 or at or above 0.55, so no generated lead distinguishes thresholds between them; hand cases at 0.21 and 0.54 record the dependence."
    kind: [A]
    rationale: "No field holds the simulation result; the threshold is this submission's invention and the first question for Stand (section 9.7 ruling)."
    question_for_stand: true
    applied_in: "graph page: `04-fire-simulation` (section 9.6: the page applies when `p_f` is above 0.50)"
