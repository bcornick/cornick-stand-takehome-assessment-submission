# ABOUTME: Interpretation rows I01 to I57, the choices an underwriter answers, and the Fire Simulation fan-out semantics.
# ABOUTME: A row holds its source page, the gap, the ruling, its kind and a rationale; flags mark lenient readings, questions for Stand and rows not evaluated.

# Branch semantics of the seven Fire Simulation board boxes that fan out (section 9.7).
fan_outs:
  "04:LEGACY": all_of
  "04:MAP": all_of
  "04:ACCESS": all_of
  "04:VEG": one_of
  "04:INGRESS": one_of
  "04:MIND": one_of
  "04:SLOPE": one_of

rows:
  - id: I01
    source: "Profile"
    gap: "KYC scale undefined; example payload shows 82"
    ruling: "Scale is 1 to 10; other values are unsupported"
    kind: [A]
    rationale: "The board leaves the KYC scale undefined and the example payload shows 82 (section 9.7 gap)."
    applied_in: "validator: `kyc_score_out_of_range` (section 9.5: `kyc_score` outside 1 to 10 is `unsupported` and goes to the underwriter)"
  - id: I02
    source: "Profile"
    gap: "KYC 5 or below"
    ruling: "Page does not apply"
    kind: [A]
    rationale: "Section 9.6 sets the Profile page to apply when `kyc_score` is above 5."
    applied_in: "graph page: `02-profile` (section 9.6: the page applies when `kyc_score` is above 5)"
  - id: I03
    source: "Profile"
    gap: "\"In the spotlight\" versus \"private\" for KYC 6 to 7"
    ruling: "Both branches begin with Exclude Liability, so the quote carries the exclusion; the distinction is recorded as an advisory for negotiation. Traces use `02:SPOT`, `02:SPOT1` for KYC 6 to 7 (the generator's own note on these leads reads \"in spotlight\") and `02:HIGH`, `02:HIGH1` for KYC 8 to 10."
    kind: [A]
    rationale: "The board leaves open whether KYC 6 to 7 is \"in the spotlight\" or \"private\"; both branches begin with Exclude Liability (section 9.7 gap and ruling)."
    lenient: true
  - id: I04
    source: "Profile"
    gap: "\"Reputational damage to Stand\""
    ruling: "Not evaluated by the system; the underwriter can decline at packet approval"
    kind: [N]
    rationale: "The board names reputational damage to Stand with no criterion; kind N is not evaluated and shown as a non-blocking note (section 9.7)."
    not_evaluated: true
  - id: I05
    source: "Profile"
    gap: "\"Deal killer\" ladders"
    ruling: "`ladder`: first rung in the packet, later rungs as an advisory"
    kind: [A]
    rationale: "Section 9.6 defines `ladder` as ordered fallbacks used in negotiation after a quote: only the first rung is an effect and the rest are recorded as an advisory."
    applied_in: "graph page: `02-profile` (the ladder node realises the rungs; the first rung is an effect and later rungs are an advisory)"
  - id: I06
    source: "Occupancy"
    gap: "Which branch applies"
    ruling: "Rentals when `is_rental` is not \"No\"; Vacant/Unoccupied when `months_unoccupied` is 1 or more; For Sale when `listed_for_sale` is true. Traces for the vacant or unoccupied branch use board box `03:UNOCC`, the box named after the registry field."
    kind: [A]
    rationale: "The board does not say which Occupancy branch applies; section 9.6 sets the page to apply when any I06 branch condition holds."
    applied_in: "graph page: `03-occupancy` (section 9.6: the page applies when any I06 branch condition holds)"
  - id: I07
    source: "Occupancy"
    gap: "60 days against a field in months"
    ruling: "1 month is under 60 days; 3 or more months is over 60 days; exactly 2 months is an underwriter choice"
    kind: [A, U]
    rationale: "The board gives 60 days and the registry counts whole months, so exactly 2 months falls between the two (section 9.7 gap)."
    choices:
      - id: I07.two_months
        options: ["under_60_days", "over_60_days"]
  - id: I08
    source: "Occupancy"
    gap: "\"Primary w/ Stand\""
    ruling: "`has_primary_policy_with_stand`"
    kind: [A]
    rationale: "The board's \"Primary w/ Stand\" has no registry field of that name; `has_primary_policy_with_stand` is the registry field for a primary policy with Stand."
  - id: I09
    source: "Occupancy"
    gap: "Rental exceptions other than Tier 1 broker (\"lead line\", \"well-managed in excess of $5m\")"
    ruling: "Underwriter choice between exception and decline"
    kind: [U]
    rationale: "The board names rental exceptions other than Tier 1 broker (\"lead line\", \"well-managed in excess of $5m\") without defining them (section 9.7 gap)."
    choices:
      - id: I09.rental_exception
        options: ["exception", "decline"]
  - id: I10
    source: "Occupancy"
    gap: "\"Consider w/ modifications\""
    ruling: "The listed modifications are effects on the quote"
    kind: [A]
    rationale: "The board says \"Consider w/ modifications\" and lists the modifications (section 9.7 gap)."
    applied_in: "graph page: `03-occupancy` (the modifications are effects in the page's outcomes)"
  - id: I11
    source: "Occupancy"
    gap: "\"Unrelated NIs\" on the overview"
    ruling: "Not evaluated"
    kind: [N]
    rationale: "The overview names \"Unrelated NIs\" and the board leaves it open (section 9.7 gap)."
    not_evaluated: true
  - id: I12
    source: "Fire Simulation"
