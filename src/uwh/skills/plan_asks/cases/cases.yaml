# ABOUTME: Cases of plan_asks (10.2): the asks a lead's triage, open conflicts and catalogue questions call for, in registry order with confirmations and catalogue questions after, the combined dwelling-use confirmation, and the class of the request that carries them.
# ABOUTME: The triage is that of the lead's real values with the case's changes; `conflicts` are the open conflicts as the ledger holds them.
cases:
  - name: lead 008 asks its two producer fields in registry order, as a routine request
    input: {lead: LEAD-00000042-008}
    expect:
      ask_ids: [property_purchase_date, electrical_panel_brand]
      message_class: routine_request

  - name: a missing pool type asks its follow-on questions too
    input: {lead: LEAD-00000042-008, facts: {pool_type: null, pool_security: null, pool_has_diving_board_or_slide: null}}
    expect:
      ask_ids: [property_purchase_date, pool_type, pool_security, pool_has_diving_board_or_slide, above_ground_pool_ladder, electrical_panel_brand]
      kinds: {pool_type: field_request, pool_security: follow_on_question}

  - name: an open conflict adds its confirmation after the field requests
    input:
      lead: LEAD-00000042-008
      conflicts:
        - validator: no_residents_in_primary_home
          fields: [number_of_residents]
          values: {number_of_residents: 0}
          question: The number of people living in the home is listed as 0. Can you confirm that number?
    expect:
      ask_ids: [property_purchase_date, electrical_panel_brand, no_residents_in_primary_home]
      kinds: {no_residents_in_primary_home: confirmation}
      message_class: routine_request

  - name: a catalogue question makes a sensitive request
    input: {lead: LEAD-00000042-008, catalogue_questions: [willing_to_mitigate]}
    expect:
      ask_ids: [property_purchase_date, electrical_panel_brand, willing_to_mitigate]
      kinds: {willing_to_mitigate: catalogue_question}
      message_class: sensitive_request

  - name: a request of confirmations alone takes the confirmation-only class
    input:
      lead: LEAD-00000042-008
      facts: {property_purchase_date: "2019-07-12", electrical_panel_brand: Square D}
      conflicts:
        - validator: acreage_zero
          fields: [acreage]
          values: {acreage: 0}
          question: The lot is listed as 0 acres. Can you confirm the acreage?
    expect:
      ask_ids: [acreage_zero]
      message_class: routine_request

  - name: the two dwelling-use conflicts are asked as one confirmation
    input:
      lead: LEAD-00000042-008
      facts: {property_purchase_date: "2019-07-12", electrical_panel_brand: Square D}
      conflicts:
        - validator: owner_occupied_with_other_use
          fields: [dwelling_type, dwelling_use_type]
          values: {dwelling_type: Owner Occupied Condo, dwelling_use_type: Tenant}
          question: The dwelling use is listed as Owner Occupied Condo and the occupancy type as Tenant. Can you confirm both?
        - validator: tenant_use_without_rental
          fields: [dwelling_use_type, is_rental]
          values: {dwelling_use_type: Tenant, is_rental: "No"}
          question: The occupancy type is listed as Tenant and the rental exposure as No. Can you confirm both?
    expect:
      ask_ids: [dwelling_use_conflict]
