- name: legacy underwriting reads the vegetation clearance 'Unknown' by its row (I15)
  input:
    lead: LEAD-00000042-008
    facts:
      p_f: 0.79
      vegetation_clearance: Unknown
      road_access: Multiple Access Points
      is_7a_compliant: true
      min_distance_to_neighbor_ft: 60
    rulings: *id003
  expect:
    choices:
    - I15.vegetation
    - I16.distance
- name: unwilling to mitigate takes the board's WILL to D_LIM edge
  input:
    lead: LEAD-00000042-008
    facts:
      p_f: 0.79
      vegetation_clearance: Too Close
      slope_angle_deg: 30.0
      min_distance_to_neighbor_ft: 14
      is_7a_compliant: false
      road_access: Multiple Access Points
      q:willing_to_mitigate: false
    rulings:
      choices:
        I13.fire_fail: legacy_underwriting
        I16.distance: adequate
        I16.slope: gentle
  expect:
