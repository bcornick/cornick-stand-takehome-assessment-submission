    lead: LEAD-00000042-008
    facts:
      p_f: 0.79
      vegetation_clearance: Adequate
      is_7a_compliant: true
      road_access: Unknown
    rulings: *id002
  expect:
    committed:
      includes: []
    choices:
    - I14.road_access
- name: legacy underwriting reads the vegetation clearance 'Too Close' by its row (I15)
  input:
    lead: LEAD-00000042-008
    facts:
      p_f: 0.79
      vegetation_clearance: Too Close
      road_access: Multiple Access Points
      is_7a_compliant: true
      min_distance_to_neighbor_ft: 60
    rulings: *id003
  expect:
    choices:
    - I16.distance
- name: legacy underwriting reads the vegetation clearance 'Adequate' by its row (I15)
  input:
    lead: LEAD-00000042-008
    facts:
      p_f: 0.79
      vegetation_clearance: Adequate
      road_access: Multiple Access Points
      is_7a_compliant: true
      min_distance_to_neighbor_ft: 60
    rulings: *id003
  expect:
