# ABOUTME: Cases of build_quote_packet (10.5): every effect of a plan on its own line with its deadline in its section, money as dollars, no rule id, the not-reviewed notes last, and a plan that holds a decline or anything open refused.
# ABOUTME: The packet body is compared whole for a plan with one effect of each type, so a missing, merged or misplaced line fails.
cases:
- name: every effect is on its own line with its deadline and no rule id
  input:
    lead_label: 8924 Lakeview Blvd
    coverages: &id001
      coverage_a:
        label: Coverage A (Dwelling)
        value: 875000
      coverage_e:
        label: Coverage E (Liability)
        value: '100000'
    plan:
      effects:
      - effect:
          type: surcharge
          rule: S-1
          percent: 15
          deadline: first_term
        trace:
          board_path:
          - 01:X
        committed: true
      - effect:
          type: surcharge
          rule: S-2
          percent: 25
        trace:
          board_path:
          - 01:X
        committed: true
      - effect:
          type: coverage_adjustment
          rule: C-1
          field: coverage_a
          proposed_value: 900000
          deadline: underwriting_period
        trace:
          board_path:
          - 01:X
        committed: true
      - effect:
          type: requirement
          rule: R-1
          text: Send the roof inspection.
          deadline: within_30_days_of_bind
        trace:
          board_path:
          - 01:X
        committed: true
      - effect:
          type: requirement
          rule: R-2
          text: Confirm the roof class.
          deadline: first_term
        trace:
          board_path:
          - 01:X
        committed: true
      - effect:
          type: requirement
          rule: R-3
          text: Confirm the siding.
          deadline: underwriting_period
        trace:
          board_path:
          - 01:X
        committed: true
      - effect:
          type: requirement
          rule: R-4
          text: Confirm the roof replacement.
          deadline: within_60_days
        trace:
          board_path:
          - 01:X
        committed: true
      - effect:
          type: exclusion_or_endorsement
          rule: E-1
          text: Liability is excluded.
        trace:
          board_path:
          - 01:X
        committed: true
      - effect:
          type: advisory
          rule: A-1
          text: Siding is vinyl.
        trace:
          board_path:
          - 01:X
        committed: true
      - effect:
          type: obligation
          rule: O-1
          text: Inspect the panel
          trigger: after bind
        trace:
          board_path:
          - 01:X
        committed: true
      - effect:
          type: no_action
          rule: N-1
        trace:
          board_path:
          - 01:X
        committed: true
      - effect:
          type: no_action
          rule: N-2
        trace:
          board_path:
          - 01:X
        committed: true
      not_evaluated:
      - ref: plumbing
        text: The Plumbing page is not evaluated.
        producer_text: Plumbing was not reviewed for this quote.
  expect:
    subject: 'Your quote: 8924 Lakeview Blvd'
    body: 'Thank you for your submission. Your quote is set out below.


      Coverages as submitted

      - Coverage A (Dwelling): $875,000

      - Coverage E (Liability): $100,000


      Surcharges

      - 15% surcharge (for the first term)

      - 25% surcharge


      Coverage adjustments

      - Coverage A (Dwelling): submitted $875,000, proposed $900,000 (for the underwriting period)


      Requirements

      - Send the roof inspection. (within 30 days of bind)

      - Confirm the roof class. (within the first term)

      - Confirm the siding. (within the underwriting period)

      - Confirm the roof replacement. (within 60 days)


      Exclusions and endorsements

      - Liability is excluded.


      Advisories

      - Siding is vinyl.


      Obligations after binding

      - Inspect the panel after bind.


      Not reviewed

      - Plumbing was not reviewed for this quote.'
- name: a plan that holds a decline is refused
  input:
    lead_label: 8924 Lakeview Blvd
    coverages: *id001
    plan:
      effects:
      - effect:
          type: decline
          rule: D-1
        trace:
          board_path:
          - 01:X
        committed: true
      not_evaluated: []
      proposed_decline: true
  expect:
    raises: nothing declined or open
- name: a plan with an undecided page is refused
  input:
    lead_label: 8924 Lakeview Blvd
    coverages: *id001
    plan:
      effects: []
      not_evaluated: []
      undecided:
      - graph: fire_simulation
        waits_on:
        - p_f
  expect:
    raises: nothing declined or open
- name: a plan with an open choice is refused
  input:
    lead_label: 8924 Lakeview Blvd
    coverages: *id001
    plan:
      effects: []
      not_evaluated: []
      open_choices:
      - choice_id: I13.fire_fail
        options:
        - decline
        prompt: p
        show: []
  expect:
    raises: nothing declined or open
- name: a plan with a catalogue question is refused
  input:
    lead_label: 8924 Lakeview Blvd
    coverages: *id001
    plan:
      effects: []
      not_evaluated: []
      catalogue_questions:
      - willing_to_mitigate
  expect:
    raises: nothing declined or open
- name: an advisory for the underwriter alone is left out of the packet
  input:
    lead_label: 8924 Lakeview Blvd
    coverages: *id001
    plan:
      effects:
      - effect:
          type: advisory
          rule: A-1
          text: Siding is vinyl.
        trace:
          board_path:
          - 01:X
        committed: true
      - effect:
          type: advisory
          rule: PP-1
          text: A decline was overridden.
          internal: true
        trace:
          board_path:
          - 01:X
        committed: true
      not_evaluated: []
  expect:
    body:
      includes:
      - Siding is vinyl.
      excludes:
      - overridden
