name: chat
version: "1"
purpose: Answers an underwriter's questions from the system's records, citing what it was shown, and turns a directive into a proposal card the underwriter applies.
trigger: the underwriter sends a chat message
command_classes: [propose_command]
actor: assistant
fallback: the conversation says the assistant is unavailable and the underwriter works from the timeline and the cards
pass_threshold: 1.0
model_skill: true
