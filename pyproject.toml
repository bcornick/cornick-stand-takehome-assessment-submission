# ABOUTME: The uwh package definition: its dependencies, the pytest markers, and the ruff and mypy settings.
# ABOUTME: uv reads this file and uv.lock to build the environment, locally and in the image.
[project]
name = "uwh"
version = "0.1.0"
description = "Skill-and-eval harness; first vertical is underwriting triage."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "httpx2>=2.13",
    "pyyaml>=6.0",
    "anthropic>=1.11",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "hypothesis>=6.100",
    "ruff>=0.16.10",
    "mypy>=2.4",
    "types-PyYAML>=6.0",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uwh"]

[tool.ruff]
line-length = 100
extend-exclude = ["sim-harness"]

[tool.ruff.format]
# ruff 0.16 formats Python code blocks inside Markdown; those blocks are prose, not source.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
strict = true
files = ["src", "tools", "evals"]

[[tool.mypy.overrides]]
module = ["leadgen", "leadgen.*", "shared", "shared.*", "mailbox", "mailbox.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root is importable, so tests import `evals`.
pythonpath = ["."]
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "slow: slow tests",
    "integration: tests that run against the leadgen and mailbox containers",
    "integration_record: integration tests that record a model exchange (live key)",
    "integration_replay: integration tests that replay a recorded model exchange",
]
