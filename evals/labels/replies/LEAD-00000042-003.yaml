# ABOUTME: Expected reading of the contradicting reply fixture for seed-42 lead 003: every field ask answered and the
# ABOUTME: months-unoccupied confirmation answered with a different number. Kind: contradicting (rule 6 then rule 3).
#
# The round-1 request asks for city, zip, residence_held_in_trust, trust_name (follow-on), insured_dob, coverage_f,
# has_animals, foundation_type, post_pier_supports_living_area and deck_height_ft (follow-ons), num_stories,
# roof_material, roof_shape, electrical_panel_size_amps, plumbing_age_years and distance_to_fire_department, with the
# months_unoccupied_in_primary_home confirmation on months_unoccupied 3 (seed42 label). The broker corrects 3 to 5:
# a changed field of the conflicting pair follows rule 3, so 5 is pending_review, 3 stays in force and the conflict
# stays open. The I13.fire_fail card is open from the first pass, so the lead waits on the underwriter either way.

lead_id: LEAD-00000042-003
intent: first_request
classification: answers_all
facts:
  city: "Boulder"                              # "The property is in Boulder"
  zip: "80302"                                 # "zip 80302"
  residence_held_in_trust: false               # "It is not held in a trust"
  insured_dob: "1979-11-02"                    # "date of birth is November 2, 1979"
  coverage_f: "1000"                           # "Medical payments at 1,000"
  has_animals: false                           # "There are no animals on the property"
  foundation_type: "Slab"                      # "sits on a slab foundation"
  num_stories: 2                               # "has two stories"
  roof_material: "Standing Seam Metal"         # "The roof is standing seam metal"
  roof_shape: "Gable"                          # "with a gable shape"
  electrical_panel_size_amps: 200              # "The electrical panel is 200 amps"
  plumbing_age_years: 12                       # "the plumbing is about 12 years old"
  distance_to_fire_department: 2.5             # "The fire department is 2.5 miles from the house"
pending_review:
  months_unoccupied: 5                         # "empty for 5 consecutive months, not 3"
confirmations:
  months_unoccupied_in_primary_home: changed
unanswered: []
dropped: []
state_after:
  round_closed: true
  underwriter_review: pending_observation      # the pending months_unoccupied value waits for approve or reject
  next: underwriter_card                       # I13.fire_fail is open and the pending observation is under review
instruction_ignored: null
notes:
  - "trust_name, post_pier_supports_living_area and deck_height_ft are follow-ons whose conditions the reply makes inactive (no trust, Slab); they are neither answered nor outstanding, so `unanswered` is empty and the classification is answers_all."
  - "months_unoccupied 5 differs from the submitted 3, so it is pending_review under rule 3 and raises an underwriter review; the value would also trip the occupancy validator, but rule 3 says it opens no second conflict. The open conflict on 3 stays open, and the Occupancy page stays undecided, until the underwriter settles the pending value."
  - "The reply unblocks the lookups: kyc_score 4 (Profile does not apply), replacement_cost 827782 against coverage_a 775000 is 0.936 (I35 no_action), protection_class \"4\", road_access Multiple Access Points. Standing Seam Metal derives Class A, so Roof is no_action even at p_f 0.79. The Siding requirement stands."
  - "`pending_observation` names the review a pending value raises; the architecture fixes review causes in the stage 2 contracts, which this label did not read, so the cause name is unverified and the grader should match on the review's kind, not its spelling."
